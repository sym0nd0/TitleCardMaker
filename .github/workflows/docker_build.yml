name: Multi-platform Docker build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      channel:
        required: true
        type: string
    outputs:
      latest_eligible:
        description: Whether this stable release is the highest verified stable version
        value: ${{ jobs.publish.outputs.latest_eligible }}
      expected_latest_tag:
        description: Verified stable exact tag selected by both Docker latest aliases
        value: ${{ jobs.publish.outputs.expected_latest_tag }}
    secrets:
      CYPRESS_RECORD_KEY:
        required: true
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      GH_TOKEN:
        required: true

permissions:
  contents: read

env:
  DOCKER_IMGNAME: ghcr.io/titlecardmaker/titlecardmaker

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate source and publication mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          case "${{ inputs.channel }}" in
            stable)
              .github/scripts/docker-semver-tags.sh derive "${{ inputs.tag }}" >/dev/null
              test "$(git rev-parse "${{ inputs.tag }}^{commit}")" = "${{ inputs.source_sha }}"
              test "$(tr -d '[:space:]' < backend/.version)" = "${{ inputs.tag }}"
              ;;
            main)
              test "${{ inputs.tag }}" = main
              ;;
            develop)
              test "${{ inputs.tag }}" = develop
              ;;
            *)
              echo "Unsupported publication channel: ${{ inputs.channel }}" >&2
              exit 1
              ;;
          esac

  build:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [linux/amd64, linux/arm64]
    env:
      DOCKERFILE: Dockerfile
      IMAGE_NAME: ''
    steps:
      - name: Set architecture image name
        shell: bash
        run: echo "IMAGE_NAME=$(cut -b 7- <<< '${{ matrix.arch }}' | tr -d '/')" >>"$GITHUB_ENV"

      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Python build inputs
        uses: actions/cache@v6
        with:
          path: python-build-cache
          key: ${{ matrix.arch }}-python-build-cache-${{ inputs.source_sha }}
          restore-keys: |
            ${{ matrix.arch }}-python-build-cache-

      - name: Inject Python build cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "python-build-cache" : "/root/.cache"
            }

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ matrix.arch }}-buildx-${{ inputs.source_sha }}
          restore-keys: |
            ${{ matrix.arch }}-buildx-

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.arch }}
          push: false
          tags: ${{ env.DOCKER_IMGNAME }}:${{ inputs.tag }}-${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            TCM_IS_DEVELOP=${{ inputs.channel == 'develop' && 'TRUE' || 'FALSE' }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move build cache
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify checkout SHA
        working-directory: .
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Cypress dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev
          libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Download amd64 image
        uses: actions/download-artifact@v8
        with:
          name: amd64-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/amd64.tar

      - name: Launch container
        run: |
          mkdir config
          docker run -itd -p 4242:4242 -e TCM_TESTING=TRUE \
            -v "./config:/config" \
            "${{ env.DOCKER_IMGNAME }}:${{ inputs.tag }}-amd64"

      - name: Start virtual display
        run: Xvfb :99 -screen 0 1920x1080x24 &

      - name: Run Cypress tests
        run: |
          npm install
          npm run cy:run:report
        env:
          DISPLAY: :99
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Parse test results
        id: pass-percentage
        run: |
          npx mochawesome-merge ./cypress/results/*.json > ./cypress/results/output.json
          echo "PASS_PERCENTAGE=$(jq '.stats.passPercent' ./cypress/results/output.json)" >>"$GITHUB_OUTPUT"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: tests/cypress/screenshots/
          retention-days: 1

      - name: Require sufficient passing tests
        if: ${{ fromJSON(steps.pass-percentage.outputs.PASS_PERCENTAGE) <= 80 }}
        run: exit 1

  publish:
    needs: [validate-inputs, build, test]
    runs-on: ubuntu-24.04
    outputs:
      latest_eligible: ${{ steps.stable-publication.outputs.latest_eligible }}
      expected_latest_tag: ${{ steps.stable-publication.outputs.expected_latest_tag }}
    env:
      DOCKER_HUB_IMGNAME: ${{ secrets.DOCKER_HUB_USERNAME }}/titlecardmaker
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout immutable source and trusted helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: '*-image'
          merge-multiple: true
          path: /tmp

      - name: Load images
        shell: bash
        run: |
          docker load --input /tmp/amd64.tar
          docker load --input /tmp/arm64.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install regctl
        uses: iarekylew00t/regctl-installer@61b6298c354562a692195ea71441e58508e667b0

      - name: Authenticate regctl
        env:
          GHCR_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            regctl registry login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --pass-stdin
          printf '%s' "$DOCKER_HUB_ACCESS_TOKEN" | \
            regctl registry login -u "$DOCKER_HUB_USERNAME" --pass-stdin

      - name: Exact-tag immutability preflight
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/docker-release-registry.sh
          stable_exact_preflight \
            "${DOCKER_IMGNAME}:${{ inputs.tag }}" \
            "${DOCKER_HUB_IMGNAME}:${{ inputs.tag }}"

      - name: Validate existing stable release inventory
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/docker-release-registry.sh
          validated_release_inventory "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" >/dev/null

      - name: Push architecture images
        shell: bash
        run: |
          set -euo pipefail
          # These are staging references for the immutable multi-platform exact
          # tag. The exact-tag preflight above is the release authority.
          docker push "${DOCKER_IMGNAME}:${{ inputs.tag }}-amd64"
          docker push "${DOCKER_IMGNAME}:${{ inputs.tag }}-arm64"

      - name: Publish exact GHCR multi-platform image
        shell: bash
        run: |
          set -euo pipefail
          exact="${DOCKER_IMGNAME}:${{ inputs.tag }}"
          docker manifest create "$exact" "${exact}-amd64" "${exact}-arm64"
          docker manifest push "$exact"

      - name: Publish and verify channel
        if: ${{ inputs.channel != 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/docker-release-registry.sh
          gh_exact="${DOCKER_IMGNAME}:${{ inputs.tag }}"
          docker_exact="${DOCKER_HUB_IMGNAME}:${{ inputs.tag }}"
          verify_release "$gh_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL" >/dev/null
          copy_exact_by_digest "$gh_exact" "$docker_exact"
          verify_release "$docker_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL" >/dev/null
          compare_releases "$gh_exact" "$docker_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL"

      - name: Publish and verify stable release and eligible aliases
        id: stable-publication
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/docker-release-registry.sh
          gh_exact="${DOCKER_IMGNAME}:${{ inputs.tag }}"
          docker_exact="${DOCKER_HUB_IMGNAME}:${{ inputs.tag }}"
          verify_release "$gh_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL" >/dev/null
          copy_exact_by_digest "$gh_exact" "$docker_exact"
          verify_release "$docker_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL" >/dev/null
          compare_releases "$gh_exact" "$docker_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL"

          candidate_file=$(mktemp)
          promotions_file=$(mktemp)
          decision_file=$(mktemp)
          trap 'rm -f "$candidate_file" "$promotions_file" "$decision_file"' EXIT
          promotion_candidates "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" \
            "${{ inputs.tag }}" >"$candidate_file"
          mapfile -t candidate_tags <"$candidate_file"
          .github/scripts/docker-semver-tags.sh promotions \
            "${{ inputs.tag }}" "${candidate_tags[@]}" >"$promotions_file"
          # Check both existing alias targets before copying any alias.
          while IFS=$'\t' read -r record alias; do
            [[ $record == promote ]] || continue
            guard_alias_promotion "${DOCKER_IMGNAME}:${alias}" \
              "${{ inputs.tag }}" "$SOURCE_URL" "${candidate_tags[@]}"
            guard_alias_promotion "${DOCKER_HUB_IMGNAME}:${alias}" \
              "${{ inputs.tag }}" "$SOURCE_URL" "${candidate_tags[@]}"
          done <"$promotions_file"
          latest_decision "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" \
            "${{ inputs.tag }}" "$promotions_file" "${candidate_tags[@]}" >"$decision_file"
          latest_eligible=$(awk -F '\t' '$1 == "latest_eligible" {print $2}' "$decision_file")
          expected_latest_tag=$(awk -F '\t' '$1 == "expected_latest_tag" {print $2}' "$decision_file")
          [[ $latest_eligible == true || $latest_eligible == false ]]
          test -n "$expected_latest_tag"
          while IFS=$'\t' read -r record alias; do
            [[ $record == promote ]] || continue
            copy_alias_by_digest "$gh_exact" "${DOCKER_IMGNAME}:${alias}"
            copy_alias_by_digest "$docker_exact" "${DOCKER_HUB_IMGNAME}:${alias}"
            verify_alias "${DOCKER_IMGNAME}:${alias}" "$gh_exact" \
              "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL"
            verify_alias "${DOCKER_HUB_IMGNAME}:${alias}" "$docker_exact" \
              "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL"
          done <"$promotions_file"
          actual_latest_tag=$(validated_common_latest_target \
            "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" "${candidate_tags[@]}")
          test "$actual_latest_tag" = "$expected_latest_tag"
          verify_release "$gh_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL" >/dev/null
          verify_release "$docker_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL" >/dev/null
          compare_releases "$gh_exact" "$docker_exact" "${{ inputs.tag }}" "${{ inputs.source_sha }}" "$SOURCE_URL"
          echo "latest_eligible=${latest_eligible}" >>"$GITHUB_OUTPUT"
          echo "expected_latest_tag=${expected_latest_tag}" >>"$GITHUB_OUTPUT"

      - name: Delete untagged GHCR images
        uses: Chizkiyahu/delete-untagged-ghcr-action@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          untagged_only: true
          except_untagged_multiplatform: true
          owner_type: org
