name: Docker SemVer Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: titlecardmaker-docker-stable
  queue: max

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout pushed tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify stable tag, commit and version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$GITHUB_REF" = "refs/tags/${tag}"
          .github/scripts/docker-semver-tags.sh derive "$tag" >/dev/null
          source .github/scripts/docker-release-registry.sh
          reject_quarantined_release "$tag"
          source_sha=$(git rev-parse "${tag}^{commit}")
          test "$source_sha" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(tr -d '[:space:]' < backend/.version)" = "$tag"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >>"$GITHUB_OUTPUT"

  docker-release:
    needs: verify-source
    uses: ./.github/workflows/docker_build.yml
    with:
      tag: ${{ needs.verify-source.outputs.tag }}
      source_sha: ${{ needs.verify-source.outputs.source_sha }}
      channel: stable
    secrets:
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  github-release:
    needs: [verify-source, docker-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}

      - name: Reconcile GitHub Release and explicit Latest state
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.verify-source.outputs.source_sha }}"
          .github/scripts/github-release.sh reconcile \
            "$GITHUB_REPOSITORY" \
            "${{ needs.verify-source.outputs.tag }}" \
            "${{ needs.verify-source.outputs.source_sha }}" \
            "${{ needs.docker-release.outputs.latest_eligible }}" \
            "${{ needs.docker-release.outputs.expected_latest_tag }}"
