name: Repair Docker SemVer Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing stable release tag (vMAJOR.MINOR.PATCH). For the one-time
          legacy latest/main migration, use the highest validated exact
          release common to both registries before the next stable publication.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: titlecardmaker-docker-stable
  queue: max

jobs:
  trusted-invocation:
    runs-on: ubuntu-24.04
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Require current default branch workflow invocation
        id: trust
        env:
          GH_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_API_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}")
          default_branch=$(jq -er '.default_branch | select(type == "string" and length > 0)' <<<"$repository_json")
          encoded_branch=$(jq -rn --arg value "$default_branch" '$value | @uri')
          branch_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_API_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}")
          trusted_sha=$(jq -er '.commit.sha | select(type == "string" and length == 40)' <<<"$branch_json")
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = "$default_branch"
          test "$GITHUB_REF" = "refs/heads/${default_branch}"
          test "$GITHUB_SHA" = "$trusted_sha"
          echo "trusted_sha=${trusted_sha}" >>"$GITHUB_OUTPUT"

  verify-release-source:
    needs: trusted-invocation
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.trusted-invocation.outputs.trusted_sha }}
          fetch-depth: 0
          path: automation

      - name: Resolve immutable release source
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TRUSTED_SHA: ${{ needs.trusted-invocation.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          automation/.github/scripts/docker-semver-tags.sh derive "$tag" >/dev/null
          source automation/.github/scripts/docker-release-registry.sh
          reject_quarantined_release "$tag"
          test "$(git -C automation rev-parse HEAD)" = "$TRUSTED_SHA"
          source_sha=$(git -C automation rev-parse "${tag}^{commit}")
          remote_refs=$(git -C automation ls-remote --exit-code origin \
            "refs/tags/${tag}" "refs/tags/${tag}^{}")
          remote_sha=$(awk -v peeled="refs/tags/${tag}^{}" -v direct="refs/tags/${tag}" \
            '$2 == peeled {p=$1} $2 == direct {d=$1} END {print (p != "" ? p : d)}' <<<"$remote_refs")
          test -n "$remote_sha"
          test "$remote_sha" = "$source_sha"
          echo "source_sha=${source_sha}" >>"$GITHUB_OUTPUT"

      - name: Checkout historical release source separately
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.source_sha }}
          path: release-source

      - name: Verify release checkout and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release-source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '[:space:]' < release-source/backend/.version)" = "$RELEASE_TAG"
          remote_refs=$(git -C automation ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
          remote_sha=$(awk -v peeled="refs/tags/${RELEASE_TAG}^{}" -v direct="refs/tags/${RELEASE_TAG}" \
            '$2 == peeled {p=$1} $2 == direct {d=$1} END {print (p != "" ? p : d)}' <<<"$remote_refs")
          test "$remote_sha" = "$SOURCE_SHA"

  repair-registry:
    needs: [trusted-invocation, verify-release-source]
    runs-on: ubuntu-24.04
    outputs:
      latest_eligible: ${{ steps.reconcile.outputs.latest_eligible }}
      expected_latest_tag: ${{ steps.reconcile.outputs.expected_latest_tag }}
    env:
      DOCKER_IMGNAME: ghcr.io/titlecardmaker/titlecardmaker
      DOCKER_HUB_IMGNAME: ${{ secrets.DOCKER_HUB_USERNAME }}/titlecardmaker
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.trusted-invocation.outputs.trusted_sha }}
          fetch-depth: 0
          path: automation

      - name: Verify trusted automation checkout
        env:
          TRUSTED_SHA: ${{ needs.trusted-invocation.outputs.trusted_sha }}
        shell: bash
        run: test "$(git -C automation rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Install regctl
        uses: iarekylew00t/regctl-installer@61b6298c354562a692195ea71441e58508e667b0

      - name: Authenticate registries
        env:
          GHCR_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | \
            regctl registry login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --pass-stdin
          printf '%s' "$DOCKER_HUB_ACCESS_TOKEN" | \
            regctl registry login -u "$DOCKER_HUB_USERNAME" --pass-stdin

      - name: Reconcile exact release and eligible aliases
        id: reconcile
        working-directory: automation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/docker-release-registry.sh
          tag=$RELEASE_TAG
          source_sha=$SOURCE_SHA
          gh_exact="${DOCKER_IMGNAME}:${tag}"
          docker_exact="${DOCKER_HUB_IMGNAME}:${tag}"
          gh_state=$(registry_tag_state "$gh_exact")
          docker_state=$(registry_tag_state "$docker_exact")
          repair_exact_source_preflight "$gh_state" "$docker_state"

          # Validate the pending repair source independently before scanning
          # history; this exact image is not necessarily present in both yet.
          if [[ $gh_state == present ]]; then
            verify_release "$gh_exact" "$tag" "$source_sha" "$SOURCE_URL" >/dev/null
          fi
          if [[ $docker_state == present ]]; then
            verify_release "$docker_exact" "$tag" "$source_sha" "$SOURCE_URL" >/dev/null
          fi
          if [[ $gh_state == present && $docker_state == present ]]; then
            compare_releases "$gh_exact" "$docker_exact" "$tag" "$source_sha" "$SOURCE_URL"
          fi

          # Existing releases are verified before any repair copy is allowed.
          validated_release_inventory "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" >/dev/null

          case "${gh_state}/${docker_state}" in
            present/absent) copy_exact_by_digest "$gh_exact" "$docker_exact" ;;
            present/present) ;;
          esac

          verify_release "$gh_exact" "$tag" "$source_sha" "$SOURCE_URL" >/dev/null
          verify_release "$docker_exact" "$tag" "$source_sha" "$SOURCE_URL" >/dev/null
          compare_releases "$gh_exact" "$docker_exact" "$tag" "$source_sha" "$SOURCE_URL"

          candidate_file=$(mktemp)
          promotions_file=$(mktemp)
          decision_file=$(mktemp)
          bootstrap_file=$(mktemp)
          trap 'rm -f "$candidate_file" "$promotions_file" "$decision_file" "$bootstrap_file"' EXIT
          promotion_candidates "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" "$tag" >"$candidate_file"
          mapfile -t candidate_tags <"$candidate_file"
          .github/scripts/docker-semver-tags.sh promotions "$tag" "${candidate_tags[@]}" >"$promotions_file"
          # Explicit repair migration: preflight every stale alias before any
          # alias write. Normal publication keeps its strict unmatched guard.
          while IFS=$'\t' read -r record alias; do
            [[ $record == promote ]] || continue
            for repository in "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME"; do
              alias_ref="${repository}:${alias}"
              bootstrap_target=$(repair_alias_bootstrap_target "$alias_ref" "$tag" \
                "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" "${candidate_tags[@]}")
              if [[ -n $bootstrap_target ]]; then
                printf '%s\t%s\n' "$alias_ref" "$bootstrap_target" >>"$bootstrap_file"
              else
                guard_alias_promotion "$alias_ref" "$tag" "$SOURCE_URL" "${candidate_tags[@]}"
              fi
            done
          done <"$promotions_file"

          if ! grep -Fqx $'promote\tlatest' "$promotions_file"; then
            # A repair of an older tag also reconciles latest to the highest
            # common validated exact tag.
            highest_common=$(highest_common_validated_exact_tag "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL")
            for repository in "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME"; do
              alias_ref="${repository}:latest"
              bootstrap_target=$(repair_alias_bootstrap_target "$alias_ref" "$highest_common" \
                "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" "${candidate_tags[@]}")
              if [[ -n $bootstrap_target ]]; then
                printf '%s\t%s\n' "$alias_ref" "$bootstrap_target" >>"$bootstrap_file"
              else
                known_latest=$(resolved_alias_target "$alias_ref" "$SOURCE_URL" "${candidate_tags[@]}")
                if [[ $known_latest != "$highest_common" ]]; then
                  # Missing aliases and older validated aliases can advance.
                  # The normal guard still rejects any known newer target.
                  guard_alias_promotion "$alias_ref" "$highest_common" "$SOURCE_URL" "${candidate_tags[@]}"
                  printf '%s\t%s\n' "$alias_ref" "$highest_common" >>"$bootstrap_file"
                fi
              fi
            done
          fi
          latest_repair_required=$(repair_latest_bootstrap_required "$bootstrap_file")
          if [[ $latest_repair_required == false ]]; then
            # Fail closed before bootstrap copies. The later call recomputes the output.
            latest_decision "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" \
              "$tag" "$promotions_file" "${candidate_tags[@]}" >/dev/null
          fi

          while IFS=$'\t' read -r alias_ref bootstrap_target; do
            [[ -n $alias_ref ]] || continue
            repository=${alias_ref%:*}
            bootstrap_sha=$(validated_tag_source_sha "$bootstrap_target")
            copy_alias_by_digest "${repository}:${bootstrap_target}" "$alias_ref"
            verify_alias "$alias_ref" "${repository}:${bootstrap_target}" \
              "$bootstrap_target" "$bootstrap_sha" "$SOURCE_URL"
          done <"$bootstrap_file"
          while IFS=$'\t' read -r record alias; do
            [[ $record == promote ]] || continue
            guard_alias_promotion "${DOCKER_IMGNAME}:${alias}" "$tag" "$SOURCE_URL" "${candidate_tags[@]}"
            guard_alias_promotion "${DOCKER_HUB_IMGNAME}:${alias}" "$tag" "$SOURCE_URL" "${candidate_tags[@]}"
          done <"$promotions_file"
          latest_decision "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" \
            "$tag" "$promotions_file" "${candidate_tags[@]}" >"$decision_file"
          latest_eligible=$(awk -F '\t' '$1 == "latest_eligible" {print $2}' "$decision_file")
          expected_latest_tag=$(awk -F '\t' '$1 == "expected_latest_tag" {print $2}' "$decision_file")
          [[ $latest_eligible == true || $latest_eligible == false ]]
          test -n "$expected_latest_tag"
          while IFS=$'\t' read -r record alias; do
            [[ $record == promote ]] || continue
            copy_alias_by_digest "$gh_exact" "${DOCKER_IMGNAME}:${alias}"
            copy_alias_by_digest "$docker_exact" "${DOCKER_HUB_IMGNAME}:${alias}"
            verify_alias "${DOCKER_IMGNAME}:${alias}" "$gh_exact" "$tag" "$source_sha" "$SOURCE_URL"
            verify_alias "${DOCKER_HUB_IMGNAME}:${alias}" "$docker_exact" "$tag" "$source_sha" "$SOURCE_URL"
          done <"$promotions_file"

          actual_latest_tag=$(validated_common_latest_target \
            "$DOCKER_IMGNAME" "$DOCKER_HUB_IMGNAME" "$SOURCE_URL" "${candidate_tags[@]}")
          test "$actual_latest_tag" = "$expected_latest_tag"

          compare_releases "$gh_exact" "$docker_exact" "$tag" "$source_sha" "$SOURCE_URL"
          remote_refs=$(git ls-remote --exit-code origin "refs/tags/${tag}" "refs/tags/${tag}^{}")
          remote_sha=$(awk -v peeled="refs/tags/${tag}^{}" -v direct="refs/tags/${tag}" \
            '$2 == peeled {p=$1} $2 == direct {d=$1} END {print (p != "" ? p : d)}' <<<"$remote_refs")
          test "$remote_sha" = "$source_sha"
          echo "latest_eligible=${latest_eligible}" >>"$GITHUB_OUTPUT"
          echo "expected_latest_tag=${expected_latest_tag}" >>"$GITHUB_OUTPUT"

  repair-github-release:
    needs: [trusted-invocation, verify-release-source, repair-registry]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.trusted-invocation.outputs.trusted_sha }}

      - name: Reconcile GitHub Release and explicit Latest state
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          TRUSTED_SHA: ${{ needs.trusted-invocation.outputs.trusted_sha }}
          SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
          LATEST_ELIGIBLE: ${{ needs.repair-registry.outputs.latest_eligible }}
          EXPECTED_LATEST_TAG: ${{ needs.repair-registry.outputs.expected_latest_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
          .github/scripts/github-release.sh reconcile \
            "$GITHUB_REPOSITORY" \
            "$RELEASE_TAG" \
            "$SOURCE_SHA" \
            "$LATEST_ELIGIBLE" \
            "$EXPECTED_LATEST_TAG"
